version: 2

models:
  - name: int_production__efficiency_metrics
    description: 生产效率指标中间模型 - 基于工单数据聚合计算生产效率指标
    config:
      tags: ["intermediate", "production", "efficiency", "analytics", "pqr"]
    columns:
      - name: workshop_id
        description: 车间ID (外键)
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_workshop')
              field: workshop_id
      - name: workshop_name
        description: 车间名称
      - name: product_id
        description: 产品ID
      - name: work_order_status
        description: 工单状态
        data_tests:
          - accepted_values:
              values: ["计划中", "进行中", "已完成", "已取消"]
      - name: total_orders
        description: 总工单数
        data_tests:
          - not_null
      - name: on_time_orders
        description: 按时完成工单数
      - name: on_time_completion_rate
        description: 按时完成率 (%)
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: avg_yield_rate
        description: 平均收率 (%)
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: avg_duration_days
        description: 平均工期 (天)
      - name: overall_yield_rate
        description: 总体收率 (%)
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: total_planned_qty
        description: 总计划数量
      - name: total_actual_qty
        description: 总实际数量

  - name: int_production__batch_genealogy
    description: PQR 批次谱系/批次质量概览中间模型 - 以工单/批次为粒度聚合偏差、检验与物料消耗指标
    config:
      tags: ["intermediate", "production", "genealogy", "quality", "pqr"]
    columns:
      - name: work_order_number
        description: 生产工单号（主键）
        data_tests:
          - unique
          - not_null
      - name: batch_number
        description: 产品批号
      - name: product_id
        description: 产品ID
      - name: manufacture_date
        description: 生产日期（使用实际完工日期，缺失时回退计划完工日期）
      - name: count_deviations
        description: 关联偏差数量
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: count_oos
        description: OOS/失败检验数量（基于检验结果状态聚合）
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: total_tests
        description: 检验总次数
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: failed_tests
        description: 失败检验次数
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: material_consumption_records
        description: 物料消耗记录数
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: distinct_materials
        description: 消耗物料种类数
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: total_material_planned_qty
        description: 物料计划消耗总量
      - name: total_material_actual_qty
        description: 物料实际消耗总量
      - name: compliance_status
        description: 批次合规状态
        data_tests:
          - accepted_values:
              values: ["Critical Issues", "OOS Observed", "Right First Time"]

  - name: int_production__operation_windows
    description: 工序窗口中间模型 - 以工单工序执行记录为粒度，形成工序 start/end 窗口用于对齐采集点
    config:
      tags: ["intermediate", "production", "operation", "window", "pqr"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - work_order_operation_id
    columns:
      - name: work_order_operation_id
        description: 工单工序执行记录ID（主键）
        data_tests:
          - not_null
      - name: work_order_number
        description: 生产工单号（外键）
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_work_order')
              field: work_order_number
      - name: batch_number
        description: 批次号
        data_tests:
          - not_null
      - name: product_id
        description: 产品ID
        data_tests:
          - not_null
      - name: operation_id
        description: 工序ID（外键）
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_operation')
              field: operation_id
      - name: window_source
        description: 窗口来源（actual/planned/unknown）
        data_tests:
          - accepted_values:
              values: ["actual", "planned", "unknown"]
      - name: window_start_at
        description: 工序窗口开始时间
        data_tests:
          - dbt_utils.accepted_range:
              min_value: "'1900-01-01'::timestamptz"
      - name: window_end_at
        description: 工序窗口结束时间
        data_tests:
          - dbt_utils.accepted_range:
              min_value: "'1900-01-01'::timestamptz"

  - name: int_quality__inspection_metrics
    description: 质量检验指标中间模型 - 基于检验申请数据聚合计算质量管理指标
    config:
      tags: ["intermediate", "quality", "inspection", "analytics", "pqr"]
    columns:
      - name: material_id
        description: 物料ID (外键)
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_material_master')
              field: material_id
      - name: material_name
        description: 物料名称
      - name: sample_type
        description: 样品类型
      - name: inspection_type
        description: 检验类型
      - name: total_requests
        description: 总申请数
        data_tests:
          - not_null
      - name: completed_requests
        description: 已完成申请数
      - name: on_time_requests
        description: 按时完成申请数
      - name: completion_rate
        description: 完成率 (%)
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: on_time_rate
        description: 按时完成率 (%)
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: avg_processing_days
        description: 平均处理时长 (天)
      - name: avg_priority_weight
        description: 平均优先级权重

  - name: int_quality__batch_compliance
    description: 批次合规指标中间模型 - 基于批次谱系计算通过率等合规指标
    config:
      tags: ["intermediate", "quality", "batch", "compliance", "pqr"]
    columns:
      - name: work_order_number
        description: 生产工单号（主键）
        data_tests:
          - unique
          - not_null
      - name: batch_number
        description: 产品批号
      - name: product_id
        description: 产品ID
      - name: manufacture_date
        description: 生产日期
      - name: total_tests
        description: 检验总次数
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: failed_tests
        description: 失败检验次数
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: passed_tests
        description: 通过检验次数
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: test_pass_rate_percent
        description: 检验通过率（%）
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: compliance_status
        description: 批次合规状态
        data_tests:
          - accepted_values:
              values: ["Critical Issues", "OOS Observed", "Right First Time"]

  - name: int_quality__process_capability
    description: 过程能力（Cpk）统计中间模型 - 按年度/产品/检验项目聚合计算 Cpk
    config:
      tags: ["intermediate", "quality", "capability", "statistics", "pqr"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - review_year
            - product_id
            - test_item_id
    columns:
      - name: review_year
        description: 回顾年度（从工单实际完工日期提取）
        data_tests:
          - not_null
      - name: product_id
        description: 产品ID
        data_tests:
          - not_null
      - name: test_item_id
        description: 检验项目ID
        data_tests:
          - not_null
      - name: measurement_count
        description: 参与统计的测量点数量
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: mean_value
        description: 均值
      - name: stddev_value
        description: 样本标准差
      - name: lsl
        description: 规格下限
      - name: usl
        description: 规格上限
      - name: cpk
        description: 过程能力指数 Cpk

  - name: int_quality__process_capability_v2
    description: 过程能力（Cpk）统计中间模型（v2）- 基于统一检验结果口径计算 Cpk
    config:
      tags: ["intermediate", "quality", "capability", "statistics", "pqr"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - review_year
            - product_id
            - test_item_id
            - uom
            - standard_id
            - standard_version
    columns:
      - name: review_year
        description: 回顾年度（优先取工单实际完工日期，缺失回退检验日期）
        data_tests:
          - not_null
      - name: product_id
        description: 产品ID
        data_tests:
          - not_null
      - name: test_item_id
        description: 检验项目ID
        data_tests:
          - not_null
      - name: uom
        description: 结果单位
        data_tests:
          - dbt_utils.not_empty_string
      - name: standard_id
        description: 质量标准ID
        data_tests:
          - dbt_utils.not_empty_string
      - name: standard_version
        description: 质量标准版本
        data_tests:
          - dbt_utils.not_empty_string
      - name: measurement_count
        description: 参与统计的测量点数量
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: mean_value
        description: 均值
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -1000000000000
              max_value: 1000000000000
      - name: stddev_value
        description: 样本标准差
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1000000000000
      - name: lsl
        description: 规格下限
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -1000000000000
              max_value: 1000000000000
      - name: usl
        description: 规格上限
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -1000000000000
              max_value: 1000000000000
      - name: cpk
        description: 过程能力指数 Cpk
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1000

  - name: int_pqr__batch_universe
    description: "PQR Scope 总线：纳入回顾范围的批次集合（所有章节统计口径基准）"
    config:
      tags: ["intermediate", "pqr", "scope"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [version_no, batch_number]
    columns:
      - name: review_scope_id
        description: "Scope 主键"
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_pqr_review_scope')
              field: review_scope_id
      - name: version_no
        description: "Scope 版本号"
        data_tests:
          - not_null
      - name: batch_number
        description: "批号"
        data_tests:
          - not_null
      - name: product_id
        description: "产品ID"
        data_tests:
          - not_null
      - name: product_variant_id
        description: "产品规格/包装ID"
        data_tests:
          - not_null
      - name: workshop_id
        description: "车间ID"
        data_tests:
          - not_null
      - name: batch_start_at
        description: "批次开始时间（按工单聚合）"
        data_tests:
          - not_null
      - name: batch_end_at
        description: "批次结束时间（按工单聚合）"
        data_tests:
          - not_null

  - name: int_pqr__scope_workshop_agg
    description: "PQR Scope 车间聚合：车间计数与展示清单"
    config:
      tags: ["intermediate", "pqr", "scope"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [review_scope_id, version_no]
    columns:
      - name: review_scope_id
        description: "Scope 主键"
        data_tests:
          - not_null
      - name: version_no
        description: "Scope 版本号"
        data_tests:
          - not_null
      - name: workshop_count
        description: "Scope 覆盖的车间数"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: workshop_list
        description: "车间名称清单（用于展示）"
        data_tests:
          - not_null_where:
              condition: "workshop_count > 0"

version: 2

sources:
  # ============================================
  # ERP系统源表 (12个表)
  # ============================================
  - name: erp_raw
    description: ERP系统原始数据 - 包含采购、物料、配方、库存等核心业务数据
    schema: public
    tables:
      # 采购订单表
      - name: erp_purchase_order
        description: 采购订单主表
        columns:
          - name: po_number
            description: 采购订单号 (主键)
          - name: supplier_id
            description: 供应商ID
          - name: po_type
            description: 订单类型
          - name: po_status
            description: 订单状态
          - name: order_date
            description: 订单日期
          - name: expected_delivery_date
            description: 预计交货日期
          - name: actual_delivery_date
            description: 实际交货日期
          - name: total_amount
            description: 订单总金额
          - name: currency
            description: 币种
          - name: buyer
            description: 采购员
          - name: approver
            description: 审批人
          - name: approval_date
            description: 审批日期
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期

      # 采购订单明细表
      - name: erp_purchase_order_detail
        description: 采购订单明细表
        columns:
          - name: pod_id
            description: 订单明细ID (主键)
          - name: po_number
            description: 采购订单号 (外键)
          - name: material_id
            description: 物料ID
          - name: quantity
            description: 订购数量
          - name: unit
            description: 单位
          - name: unit_price
            description: 单价
          - name: amount
            description: 金额
          - name: delivery_qty
            description: 已交货数量
          - name: inspection_status
            description: 检验状态

      # 物料接收表
      - name: erp_material_receipt
        description: 物料接收记录表
        columns:
          - name: receipt_id
            description: 接收记录ID (主键)
          - name: po_number
            description: 采购订单号
          - name: material_id
            description: 物料ID
          - name: batch_number
            description: 批次号
          - name: receipt_qty
            description: 接收数量
          - name: unit
            description: 单位
          - name: receipt_date
            description: 接收日期
          - name: warehouse_id
            description: 仓库ID
          - name: location_id
            description: 库位ID
          - name: inspection_status
            description: 检验状态
          - name: receiver
            description: 接收人
          - name: create_date
            description: 创建日期

      # 物料退货表
      - name: erp_material_return
        description: 物料退货记录表
        columns:
          - name: return_id
            description: 退货记录ID (主键)
          - name: receipt_id
            description: 接收记录ID
          - name: material_id
            description: 物料ID
          - name: batch_number
            description: 批次号
          - name: return_qty
            description: 退货数量
          - name: unit
            description: 单位
          - name: return_date
            description: 退货日期
          - name: return_reason
            description: 退货原因
          - name: return_status
            description: 退货状态
          - name: handler
            description: 处理人
          - name: create_date
            description: 创建日期

      # 物料主数据表
      - name: erp_material_master
        description: 物料主数据表
        columns:
          - name: material_id
            description: 物料编码 (主键)
          - name: material_name
            description: 物料名称
          - name: material_type
            description: 物料类型
          - name: specification
            description: 规格型号
          - name: unit
            description: 单位
          - name: supplier_id
            description: 供应商ID
          - name: approval_status
            description: 审批状态
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: is_deleted
            description: 删除标记

      # 供应商主数据表
      - name: erp_supplier_master
        description: 供应商主数据表
        columns:
          - name: supplier_id
            description: 供应商编码 (主键)
          - name: supplier_name
            description: 供应商名称
          - name: supplier_type
            description: 供应商类型
          - name: contact_person
            description: 联系人
          - name: contact_phone
            description: 联系电话
          - name: address
            description: 地址
          - name: qualification_status
            description: 资质状态
          - name: audit_date
            description: 审计日期
          - name: audit_score
            description: 审计得分
          - name: create_date
            description: 创建日期

      # 配方主表
      - name: erp_formula_master
        description: 配方主数据表

      # 配方明细表
      - name: erp_formula_detail
        description: 配方明细表

      # 库存主表
      - name: erp_inventory
        description: 库存主数据表

      # 库存事务表
      - name: erp_inventory_transaction
        description: 库存事务记录表

      # 仓库主表
      - name: erp_warehouse
        description: 仓库主数据表

      # 库位表
      - name: erp_storage_location
        description: 库位主数据表

  # ============================================
  # MES系统源表 (10个表)
  # ============================================
  - name: mes_raw
    description: MES系统原始数据 - 包含生产执行、设备、工艺等制造过程数据
    schema: public
    tables:
      - name: mes_work_order
        description: 生产工单主表
      - name: mes_operation
        description: 工序定义表
      - name: mes_work_order_operation
        description: 工单工序执行表
      - name: mes_production_report
        description: 生产报工记录表
        columns:
          - name: report_id
            description: 报工ID (主键)
          - name: wo_number
            description: 工单号
          - name: operation_id
            description: 工序ID
          - name: batch_number
            description: 批次号
          - name: report_date
            description: 报工日期
          - name: shift
            description: 班次
          - name: output_qty
            description: 产出数量
          - name: defect_qty
            description: 缺陷数量
          - name: defect_reason
            description: 缺陷原因
          - name: scrap_qty
            description: 报废数量
          - name: scrap_reason
            description: 报废原因
          - name: operator_id
            description: 操作员ID
          - name: reviewer_id
            description: 审核员ID
          - name: review_status
            description: 审核状态
          - name: create_date
            description: 创建日期
      - name: mes_equipment
        description: 设备主数据表
        columns:
          - name: equipment_id
            description: 设备ID (主键)
          - name: equipment_code
            description: 设备编码
          - name: equipment_name
            description: 设备名称
          - name: equipment_type
            description: 设备类型
          - name: manufacturer
            description: 制造商
          - name: model
            description: 型号
          - name: serial_number
            description: 序列号
          - name: installation_date
            description: 安装日期
          - name: workshop_id
            description: 车间ID
          - name: line_id
            description: 产线ID
          - name: status
            description: 设备状态
          - name: last_maintenance_date
            description: 上次维护日期
          - name: next_maintenance_date
            description: 下次维护日期
          - name: create_date
            description: 创建日期
      - name: mes_equipment_maintenance
        description: 设备维护记录表
      - name: mes_production_line
        description: 产线主数据表
      - name: mes_workshop
        description: 车间主数据表
      - name: mes_material_consumption
        description: 物料消耗记录表
      - name: mes_personnel
        description: 生产人员主数据表

  # ============================================
  # LIMS系统源表 (8个表)
  # ============================================
  - name: lims_raw
    description: LIMS系统原始数据 - 包含检验、样品、质量标准等实验室数据
    schema: public
    tables:
      - name: lims_inspection_request
        description: 检验申请单表
      - name: lims_inspection_task
        description: 检验任务表
      - name: lims_inspection_result
        description: 检验结果记录表
        columns:
          - name: result_id
            description: 结果ID (主键)
          - name: task_id
            description: 任务ID (外键)
          - name: test_item_id
            description: 检验项目ID (外键)
          - name: sample_id
            description: 样品ID (外键)
          - name: test_value
            description: 检验值
          - name: test_unit
            description: 检验单位
          - name: standard_min
            description: 标准下限
          - name: standard_max
            description: 标准上限
          - name: result_status
            description: 结果状态
          - name: test_date
            description: 检验日期
          - name: analyst_id
            description: 分析员ID
          - name: reviewer_id
            description: 审核员ID
          - name: review_date
            description: 审核日期
          - name: review_status
            description: 审核状态
          - name: remark
            description: 备注
          - name: create_date
            description: 创建日期
      - name: lims_sample
        description: 样品主数据表
      - name: lims_quality_standard
        description: 质量标准主表
      - name: lims_test_item
        description: 检验项目定义表
      - name: lims_analyst
        description: 分析员主数据表
      - name: lims_inspection_report
        description: 检验报告表

  # ============================================
  # QMS系统源表 (6个表)
  # ============================================
  - name: qms_raw
    description: QMS系统原始数据 - 包含变更、偏差、CAPA等质量管理数据
    schema: public
    tables:
      - name: qms_change_control
        description: 变更控制主表
        columns:
          - name: change_id
            description: 变更ID (主键)
          - name: change_code
            description: 变更编号
          - name: change_title
            description: 变更标题
          - name: change_type
            description: 变更类型
          - name: change_category
            description: 变更分类
          - name: change_description
            description: 变更描述
          - name: initiator
            description: 发起人
          - name: initiate_date
            description: 发起日期
          - name: priority
            description: 优先级
          - name: status
            description: 状态
          - name: planned_completion
            description: 计划完成日期
          - name: actual_completion
            description: 实际完成日期
          - name: reviewer
            description: 审核人
          - name: approver
            description: 批准人
          - name: approval_date
            description: 批准日期
          - name: create_date
            description: 创建日期
      - name: qms_change_impact
        description: 变更影响评估表
      - name: qms_change_implementation
        description: 变更实施记录表
      - name: qms_deviation
        description: 偏差记录主表
        columns:
          - name: deviation_id
            description: 偏差ID (主键)
          - name: deviation_code
            description: 偏差编号
          - name: deviation_title
            description: 偏差标题
          - name: deviation_type
            description: 偏差类型
          - name: deviation_category
            description: 偏差分类
          - name: product_id
            description: 产品ID
          - name: batch_number
            description: 批次号
          - name: occurrence_date
            description: 发生日期
          - name: discovery_date
            description: 发现日期
          - name: description
            description: 偏差描述
          - name: immediate_action
            description: 即时行动
          - name: root_cause
            description: 根本原因
          - name: corrective_action
            description: 纠正措施
          - name: preventive_action
            description: 预防措施
          - name: status
            description: 状态
          - name: investigator
            description: 调查员
          - name: reviewer
            description: 审核员
          - name: approver
            description: 批准人
          - name: close_date
            description: 关闭日期
          - name: create_date
            description: 创建日期
      - name: qms_capa
        description: CAPA主表
      - name: qms_supplier_audit
        description: 供应商审计记录表

  # ============================================
  # SCADA系统源表 (5个表)
  # ============================================
  - name: scada_raw
    description: SCADA系统原始数据 - 包含设备运行、环境监控、报警等过程控制数据
    schema: public
    tables:
      - name: scada_equipment_data
        description: 设备运行数据采集表
      - name: scada_environment_data
        description: 环境监控数据采集表
      - name: scada_alarm
        description: 报警记录表
        columns:
          - name: alarm_id
            description: 报警ID (主键)
          - name: equipment_id
            description: 设备ID
          - name: location_code
            description: 位置代码
          - name: alarm_type
            description: 报警类型
          - name: alarm_level
            description: 报警级别
          - name: alarm_message
            description: 报警信息
          - name: alarm_time
            description: 报警时间
          - name: ack_time
            description: 确认时间
          - name: ack_by
            description: 确认人
          - name: resolve_time
            description: 解决时间
          - name: resolve_by
            description: 解决人
          - name: alarm_status
            description: 报警状态
          - name: related_batch
            description: 相关批次
          - name: related_wo
            description: 相关工单
          - name: create_date
            description: 创建日期
      - name: scada_batch_tracking
        description: 批次追踪记录表
      - name: scada_energy_consumption
        description: 能耗监控数据表

  # ============================================
  # 药物警戒系统源表 (3个表)
  # ============================================
  - name: pv_raw
    description: 药物警戒系统原始数据 - 包含不良反应、投诉、召回等药物警戒数据
    schema: public
    tables:
      - name: pv_adverse_event
        description: 不良反应报告表
        columns:
          - name: event_id
            description: 事件ID (主键)
          - name: event_code
            description: 事件编号
          - name: product_id
            description: 产品ID
          - name: batch_number
            description: 批次号
          - name: event_date
            description: 事件发生日期
          - name: report_date
            description: 报告日期
          - name: event_type
            description: 事件类型
          - name: severity
            description: 严重程度
          - name: description
            description: 事件描述
          - name: patient_age
            description: 患者年龄
          - name: patient_gender
            description: 患者性别
          - name: outcome
            description: 结果
          - name: causality_assessment
            description: 因果关系评估
          - name: reporter_type
            description: 报告者类型
          - name: reporter_name
            description: 报告者姓名
          - name: status
            description: 状态
          - name: investigator
            description: 调查员
          - name: close_date
            description: 关闭日期
          - name: create_date
            description: 创建日期
      - name: pv_complaint
        description: 产品投诉记录表
      - name: pv_product_recall
        description: 产品召回记录表

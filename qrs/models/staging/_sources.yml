version: 2

sources:
  # ============================================
  # ERP系统源表 (12个表)
  # ============================================
  - name: erp_raw
    description: ERP系统原始数据 - 包含采购、物料、配方、库存等核心业务数据
    schema: raw
    tables:
      # 采购订单表
      - name: erp_purchase_order
        description: 采购订单主表
        columns:
          - name: po_number
            description: 采购订单号 (主键)
          - name: supplier_id
            description: 供应商ID
          - name: po_type
            description: 订单类型
          - name: po_status
            description: 订单状态
          - name: order_date
            description: 订单日期
          - name: expected_delivery_date
            description: 预计交货日期
          - name: actual_delivery_date
            description: 实际交货日期
          - name: total_amount
            description: 订单总金额
          - name: currency
            description: 币种
          - name: buyer
            description: 采购员
          - name: approver
            description: 审批人
          - name: approval_date
            description: 审批日期
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      # 采购订单明细表
      - name: erp_purchase_order_detail
        description: 采购订单明细表
        columns:
          - name: pod_id
            description: 订单明细ID (主键)
          - name: po_number
            description: 采购订单号 (外键)
          - name: material_id
            description: 物料ID
          - name: quantity
            description: 订购数量
          - name: unit
            description: 单位
          - name: unit_price
            description: 单价
          - name: amount
            description: 金额
          - name: delivery_qty
            description: 已交货数量
          - name: inspection_status
            description: 检验状态
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      # 物料接收表
      - name: erp_material_receipt
        description: 物料接收记录表
        columns:
          - name: receipt_id
            description: 接收记录ID (主键)
          - name: po_number
            description: 采购订单号
          - name: material_id
            description: 物料ID
          - name: batch_number
            description: 批次号
          - name: receipt_qty
            description: 接收数量
          - name: unit
            description: 单位
          - name: receipt_date
            description: 接收日期
          - name: warehouse_id
            description: 仓库ID
          - name: location_id
            description: 库位ID
          - name: inspection_status
            description: 检验状态
          - name: receiver
            description: 接收人
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      # 物料退货表
      - name: erp_material_return
        description: 物料退货记录表
        columns:
          - name: return_id
            description: 退货记录ID (主键)
          - name: receipt_id
            description: 接收记录ID
          - name: material_id
            description: 物料ID
          - name: batch_number
            description: 批次号
          - name: return_qty
            description: 退货数量
          - name: unit
            description: 单位
          - name: return_date
            description: 退货日期
          - name: return_reason
            description: 退货原因
          - name: return_status
            description: 退货状态
          - name: handler
            description: 处理人
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      # 物料主数据表
      - name: erp_material_master
        description: 物料主数据表
        columns:
          - name: material_id
            description: 物料编码 (主键)
          - name: material_name
            description: 物料名称
          - name: material_type
            description: 物料类型
          - name: specification
            description: 规格型号
          - name: unit
            description: 单位
          - name: supplier_id
            description: 供应商ID
          - name: approval_status
            description: 审批状态
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: is_deleted
            description: 删除标记
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      # 供应商主数据表
      - name: erp_supplier_master
        description: 供应商主数据表
        columns:
          - name: supplier_id
            description: 供应商编码 (主键)
          - name: supplier_name
            description: 供应商名称
          - name: supplier_type
            description: 供应商类型
          - name: contact_person
            description: 联系人
          - name: contact_phone
            description: 联系电话
          - name: address
            description: 地址
          - name: qualification_status
            description: 资质状态
          - name: audit_date
            description: 审计日期
          - name: audit_score
            description: 审计得分
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      # 配方主表
      - name: erp_formula_master
        description: 配方主数据表

      # 配方明细表
      - name: erp_formula_detail
        description: 配方明细表

      # 库存主表
      - name: erp_inventory
        description: 库存主数据表

      # 库存事务表
      - name: erp_inventory_transaction
        description: 库存事务记录表

      # 仓库主表
      - name: erp_warehouse
        description: 仓库主数据表

      # 库位表
      - name: erp_storage_location
        description: 库位主数据表

      - name: erp_customer_returns
        description: "投诉与退货：成品退货台账种子数据"
        columns:
          - name: return_id
            description: "退货记录ID (主键)"
          - name: batch_number
            description: "产品批号（核心关联键）"
          - name: return_date
            description: "退货日期"
          - name: _airbyte_extracted_at
            description: "数据加载时间（审计字段）"                     

  # ============================================
  # MES系统源表 (10个表)
  # ============================================
  - name: mes_raw
    description: MES系统原始数据 - 包含生产执行、设备、工艺等制造过程数据
    schema: raw
    tables:
      - name: mes_work_order
        description: 生产工单主表
      - name: mes_operation
        description: 工序定义表
      - name: mes_work_order_operation
        description: 工单工序执行表
      - name: mes_production_report
        description: 生产报工记录表
        columns:
          - name: report_id
            description: 报工ID (主键)
          - name: wo_number
            description: 工单号
          - name: operation_id
            description: 工序ID
          - name: batch_number
            description: 批次号
          - name: report_date
            description: 报工日期
          - name: shift
            description: 班次
          - name: output_qty
            description: 产出数量
          - name: defect_qty
            description: 缺陷数量
          - name: defect_reason
            description: 缺陷原因
          - name: scrap_qty
            description: 报废数量
          - name: scrap_reason
            description: 报废原因
          - name: operator_id
            description: 操作员ID
          - name: reviewer_id
            description: 审核员ID
          - name: review_status
            description: 审核状态
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      - name: mes_equipment
        description: 设备主数据表
        columns:
          - name: equipment_id
            description: 设备ID (主键)
          - name: equipment_code
            description: 设备编码
          - name: equipment_name
            description: 设备名称
          - name: equipment_type
            description: 设备类型
          - name: manufacturer
            description: 制造商
          - name: model
            description: 型号
          - name: serial_number
            description: 序列号
          - name: installation_date
            description: 安装日期
          - name: workshop_id
            description: 车间ID
          - name: line_id
            description: 产线ID
          - name: status
            description: 设备状态
          - name: last_maintenance_date
            description: 上次维护日期
          - name: next_maintenance_date
            description: 下次维护日期
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      - name: mes_equipment_maintenance
        description: 设备维护记录表
      - name: mes_production_line
        description: 产线主数据表
      - name: mes_workshop
        description: 车间主数据表
      - name: mes_material_consumption
        description: 物料消耗记录表
      - name: mes_personnel
        description: 生产人员主数据表
        
      - name: mes_equipment_calibration
        description: 设备校准记录表
        columns:
          - name: calibration_id
            description: 校准记录ID (主键)
          - name: equipment_id
            description: 设备ID (外键)
          - name: calibration_code
            description: 校准编号
          - name: calibration_type
            description: 校准类型 (内部校准/外部校准/自校准)
          - name: calibration_date
            description: 校准日期
          - name: next_calibration_date
            description: 下次校准日期
          - name: calibration_cycle
            description: 校准周期(月)
          - name: standard_equipment
            description: 标准器
          - name: standard_certificate
            description: 标准器证书号
          - name: calibration_result
            description: 校准结果 (合格/不合格/限制使用)
          - name: deviation_value
            description: 偏差值
          - name: tolerance
            description: 允许偏差
          - name: is_within_tolerance
            description: 是否在允差内
          - name: calibrator
            description: 校准人员
          - name: reviewer
            description: 审核人
          - name: certificate_no
            description: 校准证书号
          - name: calibration_status
            description: 校准状态 (有效/过期/待校准)
          - name: create_date
            description: 创建日期
          - name: _airbyte_extracted_at
            description: 抽取时间

      - name: mes_process_limits
        description: "PQR §9.2 关键工艺参数(CPP)限度种子数据：定义产品+工序+参数的标准范围，用于超限判定（受控口径建议由QA维护）"
        columns:
          - name: limit_id
            description: "限度记录ID (主键)"
          - name: product_id
            description: "产品ID"
          - name: operation_id
            description: "工序/操作ID"
          - name: param_name
            description: "工艺参数名称（需与SCADA采集参数名口径一致）"
          - name: min_value
            description: "下限（可为空，表示仅控制上限）"
          - name: max_value
            description: "上限（可为空，表示仅控制下限）"
          - name: _airbyte_extracted_at
            description: "数据加载时间（审计字段）"

  # ============================================
  # LIMS系统源表 (8个表)
  # ============================================
  - name: lims_raw
    description: LIMS系统原始数据 - 包含检验、样品、质量标准等实验室数据
    schema: raw
    tables:
      - name: lims_inspection_request
        description: 检验申请单表
      - name: lims_inspection_task
        description: 检验任务表
      - name: lims_inspection_result
        description: 检验结果记录表
        columns:
          - name: result_id
            description: 结果ID (主键)
          - name: task_id
            description: 任务ID (外键)
          - name: test_item_id
            description: 检验项目ID (外键)
          - name: sample_id
            description: 样品ID (外键)
          - name: test_value
            description: 检验值
          - name: test_unit
            description: 检验单位
          - name: standard_min
            description: 标准下限
          - name: standard_max
            description: 标准上限
          - name: result_status
            description: 结果状态
          - name: test_date
            description: 检验日期
          - name: analyst_id
            description: 分析员ID
          - name: reviewer_id
            description: 审核员ID
          - name: review_date
            description: 审核日期
          - name: review_status
            description: 审核状态
          - name: test_plan
            description: 测试计划
          - name: remark
            description: 备注
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      - name: lims_sample
        description: 样品主数据表
      - name: lims_quality_standard
        description: 质量标准主表
      - name: lims_test_item
        description: 检验项目定义表
      - name: lims_analyst
        description: 分析员主数据表
      - name: lims_inspection_report
        description: 检验报告表
      - name: lims_water_quality
        description: 工艺用水质量检测记录表
        columns:
          - name: test_id
            description: 检测记录ID (主键)
          - name: monitoring_point_id
            description: 监测点ID
          - name: monitoring_point_name
            description: 监测点名称
          - name: water_type
            description: 水类型 (纯化水/注射用水/饮用水)
          - name: parameter_name
            description: 检测参数 (TOC/电导率/微生物/pH等)
          - name: test_value
            description: 检测值
          - name: test_unit
            description: 单位
          - name: limit_min
            description: 标准下限
          - name: limit_max
            description: 标准上限
          - name: result_status
            description: 结果状态 (合格/不合格)
          - name: test_date
            description: 检测日期
          - name: analyst_id
            description: 分析员ID
          - name: equipment_id
            description: 检测设备ID
          - name: batch_number
            description: 批次号
          - name: create_date
            description: 创建日期
          - name: _airbyte_extracted_at
            description: 抽取时间
      - name: lims_stability_study
        description: 稳定性研究记录表
        columns:
          - name: study_id
            description: 研究ID (主键)
          - name: study_code
            description: 研究编号
          - name: product_id
            description: 产品ID
          - name: batch_number
            description: 批次号
          - name: study_type
            description: 研究类型 (长期/加速/中间条件)
          - name: storage_condition
            description: 储存条件
          - name: timepoint
            description: 检测时间点
          - name: timepoint_months
            description: 时间点(月)
          - name: sample_id
            description: 样品ID
          - name: test_item_id
            description: 检验项目ID
          - name: test_item_name
            description: 检验项目名称
          - name: test_value
            description: 检测值
          - name: test_unit
            description: 单位
          - name: specification
            description: 规格要求
          - name: result_status
            description: 结果状态
          - name: test_date
            description: 检测日期
          - name: analyst_id
            description: 分析员ID
          - name: study_status
            description: 研究状态
          - name: create_date
            description: 创建日期
          - name: _airbyte_extracted_at
            description: 抽取时间

  # ============================================
  # QMS系统源表 (6个表)
  # ============================================
  - name: qms_raw
    description: QMS系统原始数据 - 包含变更、偏差、CAPA等质量管理数据
    schema: raw
    tables:
      - name: qms_change_control
        description: 变更控制主表
        columns:
          - name: change_id
            description: 变更ID (主键)
          - name: change_code
            description: 变更编号
          - name: change_title
            description: 变更标题
          - name: change_type
            description: 变更类型
          - name: change_category
            description: 变更分类
          - name: change_description
            description: 变更描述
          - name: initiator
            description: 发起人
          - name: initiate_date
            description: 发起日期
          - name: priority
            description: 优先级
          - name: status
            description: 状态
          - name: planned_completion
            description: 计划完成日期
          - name: actual_completion
            description: 实际完成日期
          - name: reviewer
            description: 审核人
          - name: approver
            description: 批准人
          - name: approval_date
            description: 批准日期
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      - name: qms_change_impact
        description: 变更影响评估表
      - name: qms_change_implementation
        description: 变更实施记录表
      - name: qms_deviation
        description: 偏差记录主表
        columns:
          - name: deviation_id
            description: 偏差ID (主键)
          - name: deviation_code
            description: 偏差编号
          - name: deviation_title
            description: 偏差标题
          - name: deviation_type
            description: 偏差类型
          - name: deviation_category
            description: 偏差分类
          - name: product_id
            description: 产品ID
          - name: batch_number
            description: 批次号
          - name: occurrence_date
            description: 发生日期
          - name: discovery_date
            description: 发现日期
          - name: description
            description: 偏差描述
          - name: immediate_action
            description: 即时行动
          - name: root_cause
            description: 根本原因
          - name: corrective_action
            description: 纠正措施
          - name: preventive_action
            description: 预防措施
          - name: status
            description: 状态
          - name: investigator
            description: 调查员
          - name: reviewer
            description: 审核员
          - name: approver
            description: 批准人
          - name: close_date
            description: 关闭日期
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: Airbyte抽取时间

      - name: qms_capa
        description: CAPA主表
      - name: qms_supplier_audit
        description: 供应商审计记录表
      - name: qms_training_record
        description: 人员培训记录表
        columns:
          - name: training_id
            description: 培训记录ID (主键)
          - name: personnel_id
            description: 人员ID (外键)
          - name: course_code
            description: 课程编码
          - name: course_name
            description: 课程名称
          - name: course_type
            description: 课程类型 (GMP基础/岗位技能/SOP培训/安全培训)
          - name: training_date
            description: 培训日期
          - name: training_duration
            description: 培训时长(小时)
          - name: trainer
            description: 培训师
          - name: assessment_score
            description: 考核得分
          - name: assessment_result
            description: 考核结果 (通过/未通过/免考)
          - name: certificate_no
            description: 证书编号
          - name: valid_from
            description: 有效期开始
          - name: valid_to
            description: 有效期结束
          - name: training_status
            description: 培训状态 (已完成/进行中/已取消)
          - name: create_date
            description: 创建日期
          - name: _airbyte_extracted_at
            description: 抽取时间
      - name: qms_validation_record
        description: 验证确认记录表
        columns:
          - name: validation_id
            description: 验证记录ID (主键)
          - name: validation_code
            description: 验证编号
          - name: validation_type
            description: 验证类型 (工艺验证/清洁验证/设备验证/方法验证)
          - name: validation_title
            description: 验证标题
          - name: protocol_no
            description: 方案编号
          - name: product_id
            description: 产品ID
          - name: equipment_id
            description: 设备ID
          - name: batch_numbers
            description: 验证批次号(逗号分隔)
          - name: start_date
            description: 开始日期
          - name: end_date
            description: 结束日期
          - name: validation_result
            description: 验证结论 (通过/有条件通过/未通过)
          - name: deviation_count
            description: 偏差数量
          - name: responsible
            description: 负责人
          - name: reviewer
            description: 审核人
          - name: approver
            description: 批准人
          - name: approval_date
            description: 批准日期
          - name: next_revalidation_date
            description: 下次再验证日期
          - name: validation_status
            description: 验证状态 (草稿/进行中/待审核/已批准/已过期)
          - name: create_date
            description: 创建日期
          - name: _airbyte_extracted_at
            description: 抽取时间

      - name: qms_risk_levels
        description: 风险等级表
        columns:
          - name: risk_level_id
            description: 风险等级ID (主键)
          - name: risk_level_code
            description: 风险等级编码
          - name: risk_level_name
            description: 风险等级名称
          - name: description
            description: 风险等级描述
          - name: create_date
            description: 创建日期
          - name: update_date
            description: 更新日期
          - name: _airbyte_extracted_at
            description: 抽取时间
      
      - name: qms_risk_mapping
        description: 风险等级映射表
        columns:

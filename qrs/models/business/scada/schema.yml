version: 2

models:
  - name: equipment_monitoring
    description: 设备运行监控业务模型 - 设备运行参数数据
    config:
      tags: ['scada', 'equipment', 'monitoring', 'pqr']
    columns:
      - name: data_id
        description: 数据ID
        data_tests:
          - unique
          - not_null
      - name: quality_code
        description: 数据质量代码
        data_tests:
          - accepted_values:
              values: ['good', 'bad', 'uncertain']

  - name: environment_monitoring
    description: 环境监控业务模型 - 环境参数监控数据
    config:
      tags: ['scada', 'environment', 'monitoring', 'pqr']
    columns:
      - name: data_id
        description: 数据ID
        data_tests:
          - unique
          - not_null
      - name: monitoring_status
        description: 监控状态
        data_tests:
          - accepted_values:
              values: ['正常', '异常', '离线']

  - name: alarm_management
    description: 报警管理业务模型 - 报警记录信息
    config:
      tags: ['scada', 'alarm', 'monitoring', 'pqr']
    columns:
      - name: alarm_id
        description: 报警ID
        data_tests:
          - unique
          - not_null
      - name: alarm_level
        description: 报警级别
        data_tests:
          - accepted_values:
              values: ['高', '中', '低']
      - name: alarm_status
        description: 报警状态
        data_tests:
          - accepted_values:
              values: ['未确认', '已确认', '已解决', '未解决']

  - name: batch_tracking
    description: 批次追踪业务模型 - 批次追踪记录
    config:
      tags: ['scada', 'production', 'tracking', 'pqr']
    columns:
      - name: tracking_id
        description: 追踪ID
        data_tests:
          - unique
          - not_null
      - name: tracking_status
        description: 追踪状态
        data_tests:
          - accepted_values:
              values: ['进行中', '已完成', '已暂停', '已取消']

  - name: energy_consumption
    description: 能耗监控业务模型 - 能耗数据
    config:
      tags: ['scada', 'energy', 'monitoring', 'pqr']
    columns:
      - name: energy_id
        description: 能耗ID
        data_tests:
          - unique
          - not_null
      - name: energy_type
        description: 能源类型
        data_tests:
          - accepted_values:
              values: ['电', '蒸汽', '压缩空气', '水', '天然气']


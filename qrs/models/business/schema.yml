version: 2

models:
  - name: fct_purchase_orders
    description: 采购订单事实表 - 整合采购订单主表和明细表，提供完整的采购订单信息
    config:
      tags: ["erp", "procurement", "pqr"]
    columns:
      - name: purchase_order_number
        description: 采购订单号 (主键)
        data_tests:
          - unique
          - not_null
      - name: purchase_order_detail_id
        description: 采购订单明细ID
        data_tests:
          - unique
          - not_null
      - name: supplier_id
        description: 供应商ID (外键)
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_supplier_master')
              field: supplier_id
      - name: material_id
        description: 物料ID (外键)
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_material_master')
              field: material_id
      - name: order_status
        description: 订单状态
        data_tests:
          - accepted_values:
              values: ["待审批", "已审批", "进行中", "已完成", "已取消"]

  - name: fct_material_receipts
    description: 物料接收事实表 - 记录物料入库信息，关联采购订单和仓库
    config:
      tags: ["erp", "procurement", "quality", "pqr"]
    columns:
      - name: receipt_id
        description: 接收记录ID (主键)
        data_tests:
          - unique
          - not_null
      - name: purchase_order_number
        description: 采购订单号 (外键)
        data_tests:
          - relationships:
              to: ref('stg_purchase_order')
              field: purchase_order_number
      - name: supplier_id
        description: 供应商ID (外键)
        data_tests:
          - relationships:
              to: ref('stg_supplier_master')
              field: supplier_id
      - name: material_id
        description: 物料ID (外键)
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_material_master')
              field: material_id
      - name: warehouse_id
        description: 仓库ID (外键)
        data_tests:
          - relationships:
              to: ref('stg_warehouse')
              field: warehouse_id
      - name: location_id
        description: 库位ID (外键)
        data_tests:
          - relationships:
              to: ref('stg_storage_location')
              field: location_id
      - name: inspection_status
        description: 检验状态
        data_tests:
          - accepted_values:
              values: ["待检验", "已检验"]

  - name: fct_material_returns
    description: 物料退货业务模型 - 记录物料退货信息
    config:
      tags: ["erp", "procurement", "quality", "pqr"]
    columns:
      - name: return_id
        description: 退货记录ID
        data_tests:
          - unique
          - not_null
      - name: return_status
        description: 退货状态
        data_tests:
          - accepted_values:
              values: ["处理中", "已完成", "已取消"]

  - name: fct_formulas
    description: 配方管理业务模型 - 整合配方主表和明细表
    config:
      tags: ["erp", "production", "formula", "pqr"]
    columns:
      - name: formula_id
        description: 配方ID
        data_tests:
          - not_null
      - name: formula_status
        description: 配方状态
        data_tests:
          - accepted_values:
              values: ["有效", "无效", "草稿"]

  - name: fct_inventory
    description: 库存管理业务模型 - 提供库存信息视图
    config:
      tags: ["erp", "inventory", "pqr"]
    columns:
      - name: inventory_id
        description: 库存ID
        data_tests:
          - unique
          - not_null
      - name: inventory_status
        description: 库存状态
        data_tests:
          - accepted_values:
              values: ["正常", "待检", "冻结", "不合格"]

  - name: fct_inventory_transactions
    description: 库存事务业务模型 - 记录库存变动事务
    config:
      tags: ["erp", "inventory", "pqr"]
    columns:
      - name: transaction_id
        description: 事务ID
        data_tests:
          - unique
          - not_null
      - name: transaction_type
        description: 事务类型
        data_tests:
          - accepted_values:
              values: ["入库", "出库", "调拨", "盘点"]

  - name: dim_warehouses
    description: 仓库信息业务模型 - 整合仓库和库位信息
    config:
      tags: ["erp", "inventory", "master_data", "pqr"]
    columns:

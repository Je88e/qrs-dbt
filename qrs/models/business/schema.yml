version: 2

models:
  - name: fct_purchase_orders
    description: 采购订单事实表 - 整合采购订单主表和明细表，提供完整的采购订单信息
    config:
      tags: ["erp", "procurement", "pqr"]
    columns:
      - name: purchase_order_number
        description: 采购订单号 (主键)
        data_tests:
          - unique
          - not_null
      - name: purchase_order_detail_id
        description: 采购订单明细ID
        data_tests:
          - unique
          - not_null
      - name: supplier_id
        description: 供应商ID (外键)
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_supplier_master')
              field: supplier_id
      - name: supplier_name
        description: 供应商名称
      - name: supplier_type
        description: 供应商类型
      - name: material_id
        description: 物料ID (外键)
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_material_master')
              field: material_id
      - name: material_name
        description: 物料名称
      - name: material_type
        description: 物料类型
      - name: material_specification
        description: 物料规格
      - name: order_type
        description: 订单类型
      - name: order_status
        description: 订单状态
        data_tests:
          - accepted_values:
              values: ["待审批", "已审批", "进行中", "已完成", "已取消"]
      - name: order_date
        description: 订单日期
      - name: expected_delivery_date
        description: 预计交货日期
      - name: actual_delivery_date
        description: 实际交货日期
      - name: order_quantity
        description: 订单数量
      - name: unit
        description: 单位
      - name: unit_price
        description: 单价
      - name: line_amount
        description: 行金额
      - name: total_amount
        description: 总金额
      - name: currency
        description: 币种
      - name: delivered_quantity
        description: 已交付数量
      - name: inspection_status
        description: 检验状态
      - name: buyer
        description: 采购员
      - name: approver
        description: 审批人
      - name: approval_date
        description: 审批日期
      - name: create_date
        description: 创建日期
      - name: update_date
        description: 更新日期

  - name: fct_material_receipts
    description: 物料接收事实表 - 记录物料入库信息，关联采购订单和仓库
    config:
      tags: ["erp", "procurement", "quality", "pqr"]

        data_tests:
          - accepted_values:
              values: ["产品质量", "包装问题", "疗效问题", "不良反应", "其他"]
      - name: priority
        description: 优先级
        data_tests:
          - accepted_values:
              values: ["高", "中", "低"]
      - name: complaint_status
        description: 投诉状态

          - relationships:
              to: ref('stg_purchase_order')
              field: purchase_order_number
      - name: supplier_id
        description: 供应商ID (外键)
        data_tests:
          - relationships:
              to: ref('stg_supplier_master')
              field: supplier_id
      - name: material_id
        description: 物料ID (外键)
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_material_master')
              field: material_id
      - name: material_name
        description: 物料名称
      - name: material_type
        description: 物料类型
      - name: material_specification
        description: 物料规格
      - name: batch_number
        description: 批次号
      - name: receipt_quantity
        description: 接收数量
      - name: unit
        description: 单位
      - name: receipt_date
        description: 接收日期
      - name: receiver
        description: 接收人
      - name: warehouse_id
        description: 仓库ID (外键)
        data_tests:
          - relationships:
              to: ref('stg_warehouse')
              field: warehouse_id
      - name: warehouse_name
        description: 仓库名称
      - name: warehouse_type
        description: 仓库类型
      - name: location_id
        description: 库位ID (外键)
        data_tests:
          - relationships:
              to: ref('stg_storage_location')
              field: location_id
      - name: location_name
        description: 库位名称
      - name: inspection_status
        description: 检验状态
        data_tests:
          - accepted_values:
              values: ["待检验", "已检验"]
      - name: create_date
        description: 创建日期


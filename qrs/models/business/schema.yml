    config:
      tags: ["pv", "pharmacovigilance", "safety", "pqr"]
    columns:
      - name: event_id
        description: 事件ID
        data_tests:
          - unique
          - not_null
      - name: severity
        description: 严重程度
        data_tests:
          - accepted_values:
              values: ["轻度", "中度", "重度", "危及生命", "死亡"]
      - name: event_status
        description: 事件状态
        data_tests:
          - accepted_values:
              values: ["待评估", "调查中", "已关闭"]
      - name: causality_assessment
        description: 因果关系评估
        data_tests:
          - accepted_values:
              values:
                ["肯定相关", "很可能相关", "可能相关", "可能无关", "待评估"]

  - name: fct_complaints
    description: 投诉处理业务模型 - 产品投诉记录

version: 2

models:
  - name: purchase_order
    description: 采购订单业务模型 - 整合采购订单主表和明细表
    config:
      tags: ['erp', 'procurement', 'pqr']
    columns:
      - name: purchase_order_number
        description: 采购订单号
        data_tests:
          - not_null
      - name: supplier_id
        description: 供应商ID
      - name: material_id
        description: 物料ID
      - name: order_status
        description: 订单状态
        data_tests:
          - accepted_values:
              values: ['待审批', '已审批', '进行中', '已完成', '已取消']

  - name: material_receipt
    description: 物料接收业务模型 - 记录物料入库信息
    config:
      tags: ['erp', 'procurement', 'quality', 'pqr']
    columns:
      - name: receipt_id
        description: 接收记录ID
        data_tests:
          - unique
          - not_null
      - name: inspection_status
        description: 检验状态
        data_tests:
          - accepted_values:
              values: ['待检验', '已检验']

  - name: material_return
    description: 物料退货业务模型 - 记录物料退货信息
    config:
      tags: ['erp', 'procurement', 'quality', 'pqr']
    columns:
      - name: return_id
        description: 退货记录ID
        data_tests:
          - unique
          - not_null
      - name: return_status
        description: 退货状态
        data_tests:
          - accepted_values:
              values: ['处理中', '已完成', '已取消']

  - name: formula_management
    description: 配方管理业务模型 - 整合配方主表和明细表
    config:
      tags: ['erp', 'production', 'formula', 'pqr']
    columns:
      - name: formula_id
        description: 配方ID
        data_tests:
          - not_null
      - name: formula_status
        description: 配方状态
        data_tests:
          - accepted_values:
              values: ['有效', '无效', '草稿']

  - name: inventory_management
    description: 库存管理业务模型 - 提供库存信息视图
    config:
      tags: ['erp', 'inventory', 'pqr']
    columns:
      - name: inventory_id
        description: 库存ID
        data_tests:
          - unique
          - not_null
      - name: inventory_status
        description: 库存状态
        data_tests:
          - accepted_values:
              values: ['正常', '待检', '冻结', '不合格']

  - name: inventory_transaction
    description: 库存事务业务模型 - 记录库存变动事务
    config:
      tags: ['erp', 'inventory', 'pqr']
    columns:
      - name: transaction_id
        description: 事务ID
        data_tests:
          - unique
          - not_null
      - name: transaction_type
        description: 事务类型
        data_tests:
          - accepted_values:
              values: ['入库', '出库', '调拨', '盘点']

  - name: warehouse_info
    description: 仓库信息业务模型 - 整合仓库和库位信息
    config:
      tags: ['erp', 'inventory', 'master_data', 'pqr']
    columns:
      - name: warehouse_id
        description: 仓库ID
        data_tests:
          - not_null
      - name: warehouse_status
        description: 仓库状态
        data_tests:
          - accepted_values:
              values: ['启用', '停用']


  - name: mes_equipment_calibration
    description: 设备校准记录表种子数据
    config:
      tags: ['mes', 'seed']

  - name: mes_process_limits
    description: "PQR §9.2 关键工艺参数(CPP)限度种子数据：定义产品+工序+参数的标准范围，用于超限判定（受控口径建议由QA维护）"
    config:
      tags: ['seed', 'mes', 'cpp']
      column_types:
        limit_id: varchar(64)
        product_id: varchar(64)
        operation_id: varchar(64)
        param_name: varchar(255)
        min_value: numeric
        max_value: numeric
        unit: varchar(50)
        effective_start_date: date
        effective_end_date: date
        limit_version: varchar(50)
        limit_status: varchar(50)
        _airbyte_extracted_at: timestamptz
    columns:
      - name: limit_id
        description: "限度记录ID (主键)"
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "产品ID"
        data_tests:
          - not_null
      - name: operation_id
        description: "工序/操作ID"
        data_tests:
          - not_null
      - name: param_name
        description: "工艺参数名称（需与SCADA采集参数名口径一致）"
        data_tests:
          - not_null
      - name: min_value
        description: "下限（可为空，表示仅控制上限）"
      - name: max_value
        description: "上限（可为空，表示仅控制下限）"
      - name: _airbyte_extracted_at
        description: "数据加载时间（审计字段）"
        data_tests:
          - not_null



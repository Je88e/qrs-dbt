version: 2

seeds:
  # ============================================
  # ERP系统种子数据
  # ============================================
  - name: erp_purchase_order
    description: 采购订单主表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_purchase_order_detail
    description: 采购订单明细表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_material_receipt
    description: 物料接收记录表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_material_return
    description: 物料退货记录表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_material_master
    description: 物料主数据表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_supplier_master
    description: 供应商主数据表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_formula_master
    description: 配方主数据表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_formula_detail
    description: 配方明细表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_inventory
    description: 库存主数据表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_inventory_transaction
    description: 库存事务记录表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_warehouse
    description: 仓库主数据表种子数据
    config:
      tags: ['erp', 'seed']
      column_types:
        contact_phone: varchar(20)

  - name: erp_storage_location
    description: 库位主数据表种子数据
    config:
      tags: ['erp', 'seed']

  - name: erp_customer_returns
    description: "PQR §23 投诉与退货：成品退货台账种子数据（当前无结构化源时的过渡方案；需可关联 batch_number）"
    config:
      tags: ['seed', 'erp', 'returns']
      column_types:
        return_id: varchar(64)
        return_code: varchar(64)
        product_id: varchar(64)
        batch_number: varchar(64)
        customer_name: varchar(255)
        return_date: date
        return_quantity: numeric
        unit: varchar(50)
        return_reason: varchar(255)
        return_type: varchar(50)
        return_status: varchar(50)
        create_date: timestamp
        loaded_at: timestamptz
    columns:
      - name: return_id
        description: "退货记录ID (主键)"
        data_tests:
          - unique
          - not_null
      - name: batch_number
        description: "产品批号（核心关联键）"
        data_tests:
          - not_null
      - name: return_date
        description: "退货日期"
        data_tests:
          - not_null
      - name: loaded_at
        description: "数据加载时间（审计字段）"
        data_tests:
          - not_null

  # ============================================
  # MES系统种子数据
  # ============================================
  - name: mes_work_order
    description: 生产工单主表种子数据
    config:

version: 2

snapshots:
  - name: snap_adverse_event
    description: |
      **PV不良反应报告快照**
      
      追踪不良反应报告状态变更，支持药物警戒分析和合规审计。
      
      **业务价值**:
      - 分析不良反应报告处理时长
      - 追踪报告状态变更历史
      - 支持合规审计要求
      
      **数据粒度**: 每行代表不良反应报告在特定时间段的状态
      **更新频率**: 每日
      **数据保留**: 永久保留（合规要求）
    
    config:
      tags: ['snapshot', 'pv', 'audit', 'compliance']
    
    columns:
      - name: event_id
        description: 事件ID（业务主键）
        data_tests:
          - not_null
      
      - name: event_status
        description: |
         不良反应报告状态
          - 调查中: 正在调查的报告
          - 已关闭: 已完成调查的报告
          - 已取消: 已取消的报告
        data_tests:
          - not_null
          - accepted_values:
              values: ["调查中", "已关闭", "已取消"]
      
      - name: valid_from
        description: 记录生效时间（SCD Type 2）
        data_tests:
          - not_null
      
      - name: valid_to
        description: |
          记录失效时间（SCD Type 2）
          - 9999-12-31: 当前有效记录
          - 其他日期: 历史记录的失效时间
        data_tests:
          - not_null
      
      - name: is_deleted
        description: |
          记录删除标记
          - 0: 正常记录
          - 1: 已删除记录
        data_tests:
          - not_null
          - accepted_values:
              values: ['True', 'False']

  - name: snap_purchase_orders
    description: |
      **采购订单状态变更快照**
      
      追踪采购订单从创建到完成的全生命周期状态变更，支持 GMP 合规审计。
      
      **业务价值**:
      - 分析订单审批时长
      - 追踪订单状态变更历史
      - 支持合规审计要求
      
      **数据粒度**: 每行代表采购订单在特定时间段的状态
      **更新频率**: 每日
      **数据保留**: 永久保留（合规要求）
    
    config:
      tags: ['snapshot', 'erp', 'audit', 'compliance']
    
    columns:
      - name: purchase_order_number
        description: 采购订单号（业务主键）
        data_tests:
          - not_null
      
      - name: order_status
        description: |
          订单状态（追踪字段）
          - 待审批: 订单已创建，等待审批
          - 已审批: 订单已通过审批
          - 进行中: 订单正在执行
          - 已完成: 订单已完成
          - 已取消: 订单已取消
        data_tests:
          - not_null
          - accepted_values:
              values: ['待审批', '已审批', '进行中', '已完成', '已取消']
      
      - name: valid_from
        description: 记录生效时间（SCD Type 2）
        data_tests:
          - not_null
      
      - name: valid_to
        description: |
          记录失效时间（SCD Type 2）
          - 9999-12-31: 当前有效记录
          - 其他日期: 历史记录的失效时间
        data_tests:
          - not_null
      
      - name: is_deleted
        description: |
          记录删除标记
          - 0: 正常记录

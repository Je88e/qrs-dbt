version: 2

analyses:
  # ============================================
  # 行级审计模型
  # ============================================
  - name: audit_purchase_orders_rows
    description: |
      **审计类型**: 行级数据对比
      
      **审计目标**: 验证 fct_purchase_orders 模型与 staging 层数据的一致性
      
      **审计列**:
      - purchase_order_number (主键)
      - supplier_id
      - order_type
      - order_status
      - order_date
      - total_amount
      - currency
      - buyer
      
      **预期结果**:
      - 匹配率目标: >= 99.5%
      - 可接受差异: 时区差异、精度差异
      
      **执行方法**:
      ```bash
      dbt compile --select audit_purchase_orders_rows
      # 然后在查询工具中执行生成的 SQL
      ```
      
      **结果解读**:
      - IN_A=TRUE, IN_B=TRUE: 完全匹配的记录
      - IN_A=TRUE, IN_B=FALSE: 仅在源表存在
      - IN_A=FALSE, IN_B=TRUE: 仅在目标表存在
    
    config:
      tags: ['audit', 'row_comparison', 'erp']

  - name: audit_inspection_requests_rows
    description: |
      **审计类型**: 行级数据对比
      
      **审计目标**: 验证 fct_inspection_requests 模型与 staging 层数据的一致性
      
      **执行方法**:
      ```bash
      dbt compile --select audit_inspection_requests_rows
      ```
    
    config:
      tags: ['audit', 'row_comparison', 'lims']

  - name: audit_change_controls_rows
    description: |
      **审计类型**: 行级数据对比
      
      **审计目标**: 验证 fct_change_controls 模型与 staging 层数据的一致性
      
      **执行方法**:
      ```bash
      dbt compile --select audit_change_controls_rows
      ```
    
    config:
      tags: ['audit', 'row_comparison', 'qms']

  # ============================================
  # 列级审计模型
  # ============================================
  - name: audit_purchase_orders_columns
    description: |
      **审计类型**: 列级数据对比
      
      **审计目标**: 逐列验证采购订单数据质量，精确定位差异
      
      **审计策略**: 增量审计
      1. 第一轮: 核心业务列（total_amount, order_status）
      2. 第二轮: 关联列（supplier_id, order_date）
      3. 第三轮: 全部列
      
      **输出指标**:
      - Perfect match: 完全匹配的记录数
      - Both are null: 两边都为 NULL 的记录数
      - Values do not match: 值不匹配的记录数
      - Missing from A/B: 缺失记录数
    
    config:
      tags: ['audit', 'column_comparison', 'erp']

  - name: audit_inspection_requests_columns
    description: |
      **审计类型**: 列级数据对比
      
      **审计目标**: 逐列验证检验申请数据质量
      
      **审计列**: request_status, priority, material_id, sample_type
    
    config:
      tags: ['audit', 'column_comparison', 'lims']

  - name: audit_change_controls_columns
    description: |
      **审计类型**: 列级数据对比
      
      **审计目标**: 逐列验证变更控制数据质量
      
      **审计列**: change_status, priority, change_type, change_category
    
    config:
      tags: ['audit', 'column_comparison', 'qms']

